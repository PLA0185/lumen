name: Verify updater signing secrets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - name: Sign a fresh challenge using existing Secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY -or -not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Both updater Secrets are required' }
          [IO.File]::WriteAllText('updater-challenge.txt', [Guid]::NewGuid().ToString())
          pnpm tauri signer sign updater-challenge.txt
          if ($LASTEXITCODE -ne 0) { throw 'Signing challenge failed' }
          node tools/verify-updater-signature.mjs updater-challenge.txt updater-challenge.txt.sig
          if ($LASTEXITCODE -ne 0) { throw 'Secrets do not match configured updater public key' }
