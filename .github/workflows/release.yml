name: Release

# 打 tag（形如 v0.4.0）时自动执行完整门禁、构建 Windows 安装包并发布 Release。
# 仓库 Settings → Secrets and variables → Actions 必须配置两个 Secret：
#   - `TAURI_SIGNING_PRIVATE_KEY`：`lumen-updater.key` 的**文件内容**
#   - `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`：该密钥的密码
#
# 注意：Windows 上没法用环境变量传空密码（PowerShell 与 .NET 都会把空串
# 当成"删除该变量"），所以密钥必须带密码，否则 CLI 会卡在交互式提示上。
#
# ## 其他容易漏的点
#
# - `createUpdaterArtifacts: true` 才会产出 `*-setup.exe.sig`；
# - action 参数名是 **`uploadUpdaterJson`**，不是 `includeUpdaterJson`；
# - `uploadUpdaterSignatures` 默认 true，负责把 `.sig` 一起传上去；
# - 少了 `latest.json`（或其中任一平台的 url/signature），updater 插件会在
#   比对版本号**之前**就解析失败。
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（版本门禁）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tag and source version must be checked before all other release work.
      - name: 校验 tag 与三处应用版本
        run: node tools/check-version.mjs --tag=${{ github.ref_name }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 发版前完整门禁
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm lint
          cd src-tauri
          cargo fmt --check
          cargo check --all-targets
          cargo test --lib
          cargo clippy --all-targets --all-features -- -D warnings

      # 签名密钥缺一项都必须让发布失败，不能产出不可更新的 Release。
      - name: 检查签名密钥是否已配置
        id: guard
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=缺少 updater 签名配置::TAURI_SIGNING_PRIVATE_KEY 与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 必须同时存在。"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 构建并发布
        if: steps.guard.outputs.ok == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumen ${{ github.ref_name }}'
          releaseBody: |
            > **从 v0.3.0 或更早版本升级**
            >
            > 本版本重置了自动更新签名密钥。
            > v0.3.0 及更早版本无法通过旧签名链自动安装 v0.4.0。
            > 请手动下载安装 v0.4.0 一次。
            > 从 v0.4.0 开始，后续版本恢复应用内自动更新。

            完整更新内容见仓库中的 RELEASE_NOTES.md。安装包、签名与 latest.json 见下方 Assets。
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      # tauri-action v1 目前把 updater URL 写成 GitHub API asset URL；客户端公开分发
      # 使用无需 API Accept header 的 Releases 匿名直链更稳妥，也与应用 endpoint 约定一致。
      - name: 规范 latest.json 为匿名 Release 直链
        if: steps.guard.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern latest.json --clobber
          $release = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          [array]$installers = $release.assets | Where-Object { $_.name -match '_x64-setup\.exe$' }
          if ($installers.Count -ne 1) {
            throw "预期恰好一个 x64 NSIS installer，实际为 $($installers.Count)"
          }
          node tools/fix-updater-json.mjs `
            --repo=$env:GITHUB_REPOSITORY `
            --tag=$env:GITHUB_REF_NAME `
            --asset=$($installers[0].name) `
            --path=latest.json
          gh release upload $env:GITHUB_REF_NAME latest.json --repo $env:GITHUB_REPOSITORY --clobber
