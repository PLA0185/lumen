name: Release

# 打 tag（形如 v0.4.0）时构建签名 Android APK、Windows 安装包并发布同一个 Release。
# 仓库 Settings → Secrets and variables → Actions 必须配置以下 Secrets：
#   - `TAURI_SIGNING_PRIVATE_KEY`：`lumen-updater.key` 的**文件内容**
#   - `TAURI_SIGNING_PRIVATE_KEY_PASSWORD`：该密钥的密码
#   - `LUMEN_ANDROID_KEYSTORE_BASE64`：Android 发布 keystore 的 Base64
#   - `LUMEN_ANDROID_KEY_ALIAS`：Android 发布 key alias
#   - `LUMEN_ANDROID_KEYSTORE_PASSWORD`：keystore 密码
#   - `LUMEN_ANDROID_KEY_PASSWORD`：key 密码
#
# 注意：Windows 上没法用环境变量传空密码（PowerShell 与 .NET 都会把空串
# 当成"删除该变量"），所以密钥必须带密码，否则 CLI 会卡在交互式提示上。
#
# ## 其他容易漏的点
#
# - `createUpdaterArtifacts: true` 才会产出 `*-setup.exe.sig`；
# - action 参数名是 **`uploadUpdaterJson`**，不是 `includeUpdaterJson`；
# - `uploadUpdaterSignatures` 默认 true，负责把 `.sig` 一起传上去；
# - 少了 `latest.json`（或其中任一平台的 url/signature），updater 插件会在
#   比对版本号**之前**就解析失败。
on:
  push:
    tags:
      - 'v*'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 tag 与三处应用版本
        run: node tools/check-version.mjs --tag=${{ github.ref_name }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 与 NDK
        uses: android-actions/setup-android@v4.0.4

      - name: 安装 Android 编译工具
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: 安装 Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 Android 项目
        run: pnpm tauri android init --ci

      - name: 配置稳定的 Android 发布签名
        shell: bash
        env:
          LUMEN_ANDROID_KEYSTORE_BASE64: ${{ secrets.LUMEN_ANDROID_KEYSTORE_BASE64 }}
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.LUMEN_ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.LUMEN_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          node tools/prepare-android-signing.mjs
          echo "LUMEN_ANDROID_KEYSTORE_PATH=$PWD/src-tauri/gen/android/app/lumen-release.keystore" >> "$GITHUB_ENV"

      - name: 构建签名 Android APK
        env:
          # Gradle reads these values while building, so they must be present
          # in this step as well as in the step that configures signing.
          LUMEN_ANDROID_KEY_ALIAS: ${{ secrets.LUMEN_ANDROID_KEY_ALIAS }}
          LUMEN_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.LUMEN_ANDROID_KEYSTORE_PASSWORD }}
          LUMEN_ANDROID_KEY_PASSWORD: ${{ secrets.LUMEN_ANDROID_KEY_PASSWORD }}
        run: pnpm tauri android build --apk --target aarch64

      - name: 收集 arm64 APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*unsigned*')
          if [ "${#apks[@]}" -ne 1 ]; then
            printf '预期恰好一个已签名 APK，实际找到 %s 个\n' "${#apks[@]}"
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          mkdir -p android-release
          cp "${apks[0]}" "android-release/Lumen_${GITHUB_REF_NAME#v}_android_arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: android-release/*.apk
          if-no-files-found: error
          retention-days: 2

  release:
    permissions:
      contents: write
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node（版本门禁）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tag and source version must be checked before all other release work.
      - name: 校验 tag 与三处应用版本
        run: node tools/check-version.mjs --tag=${{ github.ref_name }}

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 发版前完整门禁
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm lint
          cd src-tauri
          cargo fmt --check
          cargo check --all-targets
          cargo test --lib
          cargo clippy --all-targets --all-features -- -D warnings

      # 签名密钥缺一项都必须让发布失败，不能产出不可更新的 Release。
      - name: 检查签名密钥是否已配置
        id: guard
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PASSWORD" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error title=缺少 updater 签名配置::TAURI_SIGNING_PRIVATE_KEY 与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 必须同时存在。"
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: 构建签名包并保存草稿
        if: steps.guard.outputs.ok == 'true'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Lumen ${{ github.ref_name }}'
          releaseBody: |
            沿用既有更新签名链和本地数据目录，无需重建任务。
            完整更新内容见仓库中的 RELEASE_NOTES.md。安装包、签名与 latest.json 见下方 Assets。
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true

      - name: 验证实际安装包签名及篡改拒绝
        if: steps.guard.outputs.ok == 'true'
        shell: pwsh
        run: |
          [array]$installers = Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*_x64-setup.exe'
          if ($installers.Count -ne 1) { throw '预期恰好一个 NSIS 安装包' }
          $artifact = $installers[0].FullName
          node tools/verify-updater-signature.mjs $artifact "$artifact.sig"
          if ($LASTEXITCODE -ne 0) { throw '安装包验签失败，Release 保持草稿，不发布更新' }

      # tauri-action v1 目前把 updater URL 写成 GitHub API asset URL；客户端公开分发
      # 使用无需 API Accept header 的 Releases 匿名直链更稳妥，也与应用 endpoint 约定一致。
      - name: 规范 latest.json 为匿名 Release 直链
        if: steps.guard.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --pattern latest.json --clobber
          if ($LASTEXITCODE -ne 0) { throw '读取 updater manifest 失败' }
          $release = gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          [array]$installers = $release.assets | Where-Object { $_.name -match '_x64-setup\.exe$' }
          if ($installers.Count -ne 1) {
            throw "预期恰好一个 x64 NSIS installer，实际为 $($installers.Count)"
          }
          node tools/fix-updater-json.mjs `
            --repo=$env:GITHUB_REPOSITORY `
            --tag=$env:GITHUB_REF_NAME `
            --asset=$($installers[0].name) `
            --path=latest.json
          if ($LASTEXITCODE -ne 0) { throw '规范 updater manifest 失败' }
          gh release upload $env:GITHUB_REF_NAME latest.json --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传 updater manifest 失败' }

      - name: 下载 Android APK 并添加到同一 Release
        uses: actions/download-artifact@v4
        with:
          name: android-apk-${{ github.ref_name }}
          path: android-release

      - name: 上传 Android APK
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [array]$apks = Get-ChildItem -LiteralPath android-release -Filter '*.apk'
          if ($apks.Count -ne 1) { throw "预期一个 Android APK，实际找到 $($apks.Count) 个" }
          gh release upload $env:GITHUB_REF_NAME $apks[0].FullName --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传 Android APK 失败' }

      - name: 发布已验签的 Release
        if: steps.guard.outputs.ok == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release 发布失败' }
