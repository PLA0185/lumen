name: CI

# 持续集成：**只判断代码健康，不做任何打包与签名**。
#
# 与 Release 分离的原因（整改任务书 §8.6）：
# Release 工作流在缺少 updater 签名密钥时会跳过构建步骤，
# 于是"Release 成功"**不能**证明当前代码通过测试。
# 因此把"跑测试"放在这里：它不需要任何密钥，push 到 main 就会真实执行。
#
# 本仓库有 Windows 专属依赖（Tauri / WebView2 / NSIS），
# 所以两边都跑在 windows-latest 上，而不是图快用 Linux
# ——与实际发布环境差异过大的系统测不出真问题（§8.5）。
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# 同一个分支上只保留最新一次运行，避免连续 push 时排队堆积
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（锁定文件必须一致）
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 三处版本一致性
        run: pnpm check:version

      - name: 单元测试
        run: pnpm test

      - name: 构建前端产物
        run: pnpm build

      - name: Lint
        run: pnpm lint

  rust:
    name: rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- 先构建前端产物，原因见 clippy 步骤的注释 ----
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖（供前端构建使用）
        run: pnpm install --frozen-lockfile

      - name: 构建前端产物
        # 必须步骤，不是可选项：`--all-features` 会启用 tauri 的
        # `custom-protocol`，而 `tauri::generate_context!()` 在该 feature 下
        # **要把 `frontendDist`（`../dist`）嵌进二进制**，目录不存在就直接
        # proc macro panic：`The frontendDist configuration is set to "../dist"
        # but this path doesn't exist`。
        # 这一条正是"本地全绿、CI 红"的根因：本机跑过 pnpm build 所以有 dist，
        # 而 CI 的 rust job 原先只编译 Rust、不产出前端。
        run: pnpm build

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存构建产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 代码格式检查
        working-directory: src-tauri
        run: cargo fmt --check

      - name: 编译检查（含测试与示例）
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: 单元与集成测试
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy（把警告当错误，**不加任何豁免**）
        working-directory: src-tauri
        # 与本地**完全同一条命令**（任务书 §8.3 方案 A / §15）。
        #
        # 两个必须一起满足的前提，缺一个就会"本地绿、CI 红"：
        # 1. 前端产物 `../dist` 必须先构建好（见上面的 pnpm build）；
        # 2. 本地也一样 —— 直接 `cargo clippy --all-features` 而没跑过 `pnpm build`
        #    会看到 `frontendDist ... doesn't exist` 的 proc macro panic。
        #
        # 失败时把尾部输出写进 job summary：Actions 的**原始日志下载需要认证**，
        # 而 step summary 在页面上（含未登录）就能看到，便于定位这类 CI 专属差异。
        shell: pwsh
        run: |
          cargo clippy --all-targets --all-features -- -D warnings 2>&1 | Tee-Object -FilePath clippy.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            "## Clippy 失败（exit $code）" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            (Get-Content clippy.log -Tail 80) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $code
          }
